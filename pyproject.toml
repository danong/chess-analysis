[project]
name = "chess-research"
version = "0.1.0"
description = "Discover level-dependent chess decision patterns from human games."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chess",
    "zstandard",
    "pyarrow",
    "duckdb",
    "numpy",
    "scipy",
    "scikit-learn",
    "typer",
    "rich",
    "matplotlib",
    "jinja2",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
chess-research = "chess_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_research"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
